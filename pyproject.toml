[project]
name = "torrent-tracker-blocker"
version = "0.1.0"
description = "Block BitTorrent trackers with iptables"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
tracker-blocker = "torrent_tracker_blocker.cli:main"

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Fixed argv, no shell; every interpolated value is validated first.
"src/torrent_tracker_blocker/firewall.py" = ["S603", "S607"]
"tests/test_integration.py" = ["S603", "S607"]
